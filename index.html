<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love</title>
<style>
body{margin:0;background:black;overflow:hidden;font-family:Arial;}
#stage{position:fixed;width:100%;height:100%;background:black;display:flex;align-items:center;justify-content:center;}
#playBtn{position:absolute;z-index:20;width:120px;height:120px;background:black;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 30px rgba(0,0,0,0.8);}
#playBtn:after{content:"";border-left:35px solid white;border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:6px;}
.curtain{position:absolute;top:0;width:50%;height:100%;background-image:url("curtain.jpg");background-size:200% 100%;background-repeat:no-repeat;transition:2.2s ease;z-index:10;}
#leftCurtain{left:0;background-position:left center;}
#rightCurtain{right:0;background-position:right center;}
.openLeft{transform:translateX(-100%);}
.openRight{transform:translateX(100%);}
#countdown{position:absolute;display:none;width:100%;height:100%;z-index:5;}
#countVideo{width:100%;height:100%;object-fit:cover;}
#flash{position:fixed;width:100%;height:100%;background:white;opacity:0;pointer-events:none;transition:0.3s;}
#codeScreen{position:fixed;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:black;color:white;text-align:center;}
input{padding:12px;font-size:18px;border:none;border-radius:8px;margin-top:10px;}
button{padding:12px 25px;margin-top:10px;border:none;border-radius:20px;background:#e91e63;color:white;font-size:18px;cursor:pointer;}
#error{color:red;margin-top:10px;display:none;}
#result{display:none;position:fixed;width:100%;height:100%;background:black;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:20px;box-sizing:border-box;}
#photo{width:80%;max-width:400px;border-radius:20px;margin-bottom:10px;}
#actionButtons{display:flex;flex-direction:column;align-items:center;gap:10px;}
#musicBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:50;}
#player{width:100%;height:100%;}
#audioBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:50;flex-direction:column;align-items:center;justify-content:center;}
#audioBox audio{width:85%;max-width:400px;}
#heartLayer{position:fixed;width:100%;height:100%;top:0;left:0;pointer-events:none;overflow:hidden;z-index:999;}
.heart{position:absolute;color:red;font-size:22px;animation:float 6s linear infinite;}
@keyframes float{0%{transform:translateY(100vh);opacity:1}100%{transform:translateY(-10vh);opacity:0}}
</style>
</head>
<body>

<div id="stage">
  <div id="playBtn" onclick="startExperience()"></div>
  <div id="leftCurtain" class="curtain"></div>
  <div id="rightCurtain" class="curtain"></div>
  <div id="countdown"><video id="countVideo" src="countdown.mp4"></video></div>
</div>

<div id="flash"></div>

<div id="codeScreen">
  <h2>❤️Sürprize son bir adım❤️</h2>
  <input id="codeInput" placeholder="Kod gir" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
  <button onclick="go()">Aç</button>
  <div id="error">Yanlış Kod</div>
</div>

<div id="result">
  <img id="photo">
  <div id="actionButtons"></div>
</div>

<div id="musicBox">
  <div id="player"></div>
</div>

<div id="audioBox">
  <audio id="audioPlayer" controls autoplay></audio>
  <button onclick="closeAudio()">Kapat</button>
</div>

<div id="heartLayer"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>

let currentCode="";
let player;
let videoOpen=false;
let youtubeId=null;
let audioURL=null;

/* GERİ TUŞU */
window.addEventListener("popstate",function(){
  if(videoOpen){
    closeVideo(true);
  }
});

/* Başlatma */
function startExperience(){
  document.getElementById("playBtn").style.display="none";
  document.getElementById("leftCurtain").classList.add("openLeft");
  document.getElementById("rightCurtain").classList.add("openRight");
  setTimeout(startCountdown,2200);
}

function startCountdown(){
  let c=document.getElementById("countdown");
  let v=document.getElementById("countVideo");
  c.style.display="block";
  v.play();
  v.onended=function(){flash();}
}

function flash(){
  let f=document.getElementById("flash");
  f.style.opacity="1";
  setTimeout(()=>{f.style.opacity="0";showCode();},300);
}

function showCode(){
  document.getElementById("stage").style.display="none";
  document.getElementById("codeScreen").style.display="flex";

  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerText="❤";
    h.style.left=Math.random()*100+"%";
    document.getElementById("heartLayer").appendChild(h);
    setTimeout(()=>h.remove(),6000);
  },300);
}

/* Kod doğrula ve içerikleri göster */
async function go(){
  let code=document.getElementById("codeInput").value.trim();
  if(code==="") return;

  currentCode=code;
  document.getElementById("error").style.display="none";

  let data = await getMediaData(code);

  if(!data){
    document.getElementById("error").style.display="block";
    return;
  }

  youtubeId = data.youtube || null;
  audioURL = data.audio || null;

  document.getElementById("codeScreen").style.display="none";
  document.getElementById("result").style.display="flex";

  loadPhoto(code);
  loadActionButtons();
}

/* data.json'dan YouTube ID ve ses linkini çek (kod geçerliliği de burada belirlenir) */
/* index.html GitHub Pages'te kaldığı için (Vercel'den farklı bir alan adı), */
/* buraya Vercel projenin TAM adresini yazman gerekiyor. Deploy ettikten sonra */
/* Vercel'in verdiği adresle "SENIN-VERCEL-PROJEN" kısmını değiştir. */
async function getMediaData(code){
  try{
    let res = await fetch(`https://SENIN-VERCEL-PROJEN.vercel.app/api/getdata?code=${encodeURIComponent(code)}`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

/* Fotoğraf varsa göster, yoksa gizle (artık kod geçerliliğini etkilemiyor) */
function loadPhoto(code){
  let photoURL=`https://res.cloudinary.com/dbtlit7hz/image/upload/clients/${code}/${code}.jpg`;
  let img=document.getElementById("photo");
  let test=new Image();

  test.onload=function(){
    img.src=photoURL;
    img.style.display="block";
  };
  test.onerror=function(){
    img.style.display="none";
  };
  test.src=photoURL;
}

/* Hangi butonun/butonların gösterileceğine karar ver */
function loadActionButtons(){
  let container=document.getElementById("actionButtons");
  container.innerHTML="";

  if(youtubeId){
    let btn=document.createElement("button");
    btn.innerText="Şarkını Çal 🎵";
    btn.onclick=playMusic;
    container.appendChild(btn);
  }

  if(audioURL){
    let btn=document.createElement("button");
    btn.innerText="Sesli Mesajını Dinle 🎧";
    btn.onclick=playAudioMessage;
    container.appendChild(btn);
  }
}

/* Müzik çal (YouTube) */
async function playMusic(){
  if(!youtubeId){ alert("Şarkı yok"); return; }

  document.getElementById("result").style.display="none";
  document.getElementById("musicBox").style.display="block";

  history.pushState({video:true},"");

  videoOpen=true;

  player = new YT.Player('player',{
    videoId:youtubeId,
    events:{'onStateChange':onPlayerStateChange}
  });
}

function onPlayerStateChange(e){
  if(e.data===0){
    closeVideo(false);
  }
}

function closeVideo(fromBack){
  document.getElementById("musicBox").style.display="none";
  document.getElementById("result").style.display="flex";

  if(player){
    player.destroy();
    player=null;
  }

  videoOpen=false;

  if(!fromBack){
    history.back();
  }
}

/* Sesli mesajı çal (Cloudinary mp3) */
function playAudioMessage(){
  if(!audioURL) return;
  document.getElementById("result").style.display="none";
  document.getElementById("audioBox").style.display="flex";
  let p=document.getElementById("audioPlayer");
  p.src=audioURL;
  p.play();
}

function closeAudio(){
  let p=document.getElementById("audioPlayer");
  p.pause();
  p.currentTime=0;
  document.getElementById("audioBox").style.display="none";
  document.getElementById("result").style.display="flex";
}

</script>
</body>
</html>
